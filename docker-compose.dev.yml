version: '3'

volumes:
  pg_data:
  static:

services:
  db:
    image: postgres:13
    env_file: .env
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: on-failure:3
  backend:
    build:
      context: ./backend/
    env_file: .env
    volumes:
      - ./backend:/app
      - static:/backend_static
      # - media:/app/media/
    depends_on:
      db:
        condition: service_healthy
    command: bash -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    environment:
      PYTHONPATH: /app
    restart: on-failure:3
  frontend:
    build: 
      context: ./frontend/
      dockerfile: Dockerfile.dev
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - static:/static
    command: npm run dev
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000
  gateway:
    build: 
      context: ./gateway/
      dockerfile: Dockerfile.dev
    ports:
      - 8000:80
    depends_on:
      - frontend
      - backend
    restart: on-failure:3
